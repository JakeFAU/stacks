global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: stacks
    static_configs:
      - targets:
          - otel-collector:9464

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
