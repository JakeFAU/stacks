name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Create synthetic PostgreSQL environment
        run: |
          umask 077
          {
            echo 'STACKS_DB_ADMIN_PASSWORD=synthetic-ci-admin-password'
            echo 'STACKS_DB_APP_PASSWORD=synthetic-ci-app-password'
            echo 'STACKS_DATABASE_URL=postgres://stacks_app:synthetic-ci-app-password@127.0.0.1:5432/stacks?sslmode=disable'
            echo 'STACKS_MIGRATION_DATABASE_URL=postgres://stacks_admin:synthetic-ci-admin-password@127.0.0.1:5432/stacks?sslmode=disable'
            echo 'STACKS_DATABASE_SCOPES=core'
            echo 'STACKS_DATABASE_APP_ROLE=stacks_app'
            echo 'STACKS_TEST_DATABASE_URL=postgres://stacks_app:synthetic-ci-app-password@127.0.0.1:5432/stacks?sslmode=disable'
            echo 'STACKS_TEST_MIGRATION_DATABASE_URL=postgres://stacks_admin:synthetic-ci-admin-password@127.0.0.1:5432/stacks?sslmode=disable'
          } > .env.ci

      - name: Start PostgreSQL
        run: make db-up ENV_FILE=.env.ci

      - name: Apply canonical migrations
        run: make db-migrate ENV_FILE=.env.ci

      - name: Check migration status
        run: make db-status ENV_FILE=.env.ci

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check modules
        run: make modules-check

      - name: Staticcheck
        run: make staticcheck

      - name: Test
        run: make test

      - name: Test race detector
        run: make test-race

      - name: Build
        run: make build

      - name: Test PostgreSQL integration
        run: make test-integration ENV_FILE=.env.ci

      - name: Stop PostgreSQL
        if: always()
        run: make db-down ENV_FILE=.env.ci
